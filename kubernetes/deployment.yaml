apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-devops-platform
  template:
    metadata:
      labels:
        app: ai-devops-platform
    spec:
      containers:
        - name: ai-devops-platform
          image: abidagha172/ai-devops-platform:latest
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15